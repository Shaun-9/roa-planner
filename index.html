<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROA — Member List</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>

  <nav class="navbar">
    <span class="navbar-brand">ROA <span>Planner</span></span>
    <span class="navbar-sub">Route of Advancement — Military Expert Scheme</span>
  </nav>

  <div class="page-container">

    <div class="page-header">
      <h1>Member Profiles</h1>
      <p>Select a member to view their full career roadmap.</p>
    </div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="search-input" placeholder="Search by name or service no…" />

        <select id="rank-filter">
          <option value="">All Ranks</option>
          <option value="me4">ME4</option>
          <option value="me5">ME5</option>
          <option value="me6">ME6</option>
          <option value="me7">ME7</option>
        </select>

        <select id="comp-filter">
          <option value="">All Competencies</option>
          <option value="Software Engineering">Software Engineering</option>
          <option value="Cloud Engineering">Cloud Engineering</option>
          <option value="Data Analytics and AI">Data Analytics and AI</option>
          <option value="Product Management">Product Management</option>
        </select>

        <span class="member-count" id="member-count">Loading…</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Service No.</th>
            <th>Name</th>
            <th>Rank</th>
            <th>Competency</th>
            <th>Aspiration</th>
            <th>Potential</th>
            <th>Leadership</th>
            <th>EOS Date</th>
          </tr>
        </thead>
        <tbody id="member-tbody">
          <tr><td colspan="8" class="empty-state">Loading members…</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="data/mock_data.js"></script>
  <script src="data/rules.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sharepoint.js"></script>
  <script src="js/data_client.js"></script>
  <script src="js/member_list.js"></script>

</body>
</html>
